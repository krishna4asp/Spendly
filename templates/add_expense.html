{% extends "base.html" %}
{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Add Expense</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('add_expense') }}" novalidate>
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0.01"
                    placeholder="0.00"
                    value="{{ form_amount or '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled {% if not form_category %}selected{% endif %}>Select a category</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if form_category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ form_date or '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description <span class="field-optional">(optional)</span></label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    maxlength="200"
                    placeholder="What was this for?"
                    value="{{ form_description or '' }}"
                >
            </div>

            <button type="submit" class="btn-primary">Save Expense</button>
        </form>

        <a href="{{ url_for('profile') }}" class="auth-alt-link">Cancel</a>
    </div>
</div>
{% endblock %}
